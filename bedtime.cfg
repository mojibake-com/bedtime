# Early bed shutoff for a Voron 2.4.
#
# The bed heater turns off `lead_time` seconds before the slicer says
# the print will finish, so the PEI cools and the part lets go. Only
# the bed heater changes. Mainsail shows the macros below as buttons.
#
# Install bedtime.py into Klipper first (see README.md). Then add
# this line to printer.cfg:
#
#   [include bedtime.cfg]
#
# 900 seconds is 15 minutes. A Voron bed is slow to cool, especially
# at ABS temperatures. Raise this if the part is still stuck. Lower it
# only if the part lets go while the nozzle is still moving.

[bedtime]
lead_time: 900
heater: heater_bed
target_temp: 0
# Slicer-seconds of the toolpath that must finish before the bed is
# allowed to turn off. Heat soak and quad-gantry level do not count.
min_elapsed: 120
keep_off: True

[gcode_macro BEDTIME_ARM]
description: Turn the bed off a few minutes before the print ends
gcode:
    BEDTIME_ENABLE

[gcode_macro BEDTIME_DISARM]
description: Keep the bed hot until the print finishes
gcode:
    BEDTIME_DISABLE

[gcode_macro BEDTIME_OFF_NOW]
description: Turn the bed off now
gcode:
    BEDTIME_NOW

[gcode_macro BEDTIME_INFO]
description: Show when the bed will turn off
gcode:
    BEDTIME_STATUS
